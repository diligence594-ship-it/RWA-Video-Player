<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 𝐌𝐑𝐒𝐓𝐑𝐀𝐍𝐆𝐄𝐑™ 』 Batch Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { margin-bottom: 20px; color: #58a6ff; font-size: 1.8rem; }
        .controls { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        select { padding: 12px; background: #161b22; color: #f0f6fc; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; outline: none; }
        select:focus { border-color: #58a6ff; }
        video { width: 100%; max-width: 850px; background: #000; border-radius: 8px; border: 1px solid #30363d; aspect-ratio: 16/9; }
        .pdf-btn { display: inline-block; padding: 10px 15px; background: #238636; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>『 𝐌𝐑𝐒𝐓𝐑𝐀𝐍𝐆𝐄𝐑™ 』 Video Player</h1>

    <div class="controls">
        <select id="batchSelect" onchange="loadSubjects()">
            <option value="">-- Select Batch --</option>
        </select>

        <select id="subjectSelect" onchange="loadTopics()">
            <option value="">-- Select Subject --</option>
        </select>

        <select id="topicSelect" onchange="loadLectures()">
            <option value="">-- Select Topic --</option>
        </select>

        <select id="lectureSelect" onchange="playSelectedVideo()">
            <option value="">-- Select Lecture --</option>
        </select>

        <a id="pdfLink" class="pdf-btn" style="display: none;" target="_blank">Download PDF Notes</a>
    </div>

    <video id="videoPlayer" controls></video>

<script>
    let hlsInstance = null;

    window.onload = async () => {
        try {
            const res = await fetch('/api/batches', { method: 'POST', headers: {'Content-Type': 'application/json'} });
            const data = await res.json();
            const batchSelect = document.getElementById('batchSelect');
            
            if (Array.isArray(data)) {
                data.forEach(batch => {
                    let opt = document.createElement('option');
                    opt.value = batch.id;
                    opt.textContent = batch.name;
                    batchSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Batches fetch error:", err);
        }
    };

    async function loadSubjects() {
        const batchId = document.getElementById('batchSelect').value;
        const subjectSelect = document.getElementById('subjectSelect');
        document.getElementById('topicSelect').innerHTML = '<option value="">-- Select Topic --</option>';
        document.getElementById('lectureSelect').innerHTML = '<option value="">-- Select Lecture --</option>';
        subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';

        if (!batchId) return;

        try {
            const res = await fetch('/api/subjects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batch_id: batchId })
            });
            const data = await res.json();

            if (Array.isArray(data)) {
                data.forEach(sub => {
                    let opt = document.createElement('option');
                    opt.value = sub.id;
                    opt.textContent = sub.name;
                    subjectSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Subjects fetch error:", err);
        }
    }

    async function loadTopics() {
        const batchId = document.getElementById('batchSelect').value;
        const subjectId = document.getElementById('subjectSelect').value;
        const topicSelect = document.getElementById('topicSelect');
        document.getElementById('lectureSelect').innerHTML = '<option value="">-- Select Lecture --</option>';
        topicSelect.innerHTML = '<option value="">-- Select Topic --</option>';

        if (!subjectId) return;

        try {
            const res = await fetch('/api/topics', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ course_id: batchId, subject_id: subjectId })
            });
            const data = await res.json();

            if (Array.isArray(data)) {
                data.forEach(topic => {
                    let opt = document.createElement('option');
                    opt.value = topic.id;
                    opt.textContent = topic.name;
                    topicSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Topics fetch error:", err);
        }
    }

    async function loadLectures() {
        const batchId = document.getElementById('batchSelect').value;
        const subjectId = document.getElementById('subjectSelect').value;
        const topicId = document.getElementById('topicSelect').value;
        const lectureSelect = document.getElementById('lectureSelect');
        
        lectureSelect.innerHTML = '<option value="">⏳ Fetching Lectures...</option>';

        if (!topicId) return;

        try {
            const res = await fetch('/api/lectures', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ course_id: batchId, subject_id: subjectId, topic_id: topicId })
            });
            const data = await res.json();

            lectureSelect.innerHTML = '<option value="">-- Select Lecture --</option>';

            if (Array.isArray(data) && data.length > 0) {
                data.forEach(lec => {
                    let opt = document.createElement('option');
                    opt.value = lec.id;
                    opt.textContent = lec.name;
                    lectureSelect.appendChild(opt);
                });
            } else {
                lectureSelect.innerHTML = '<option value="">-- No Lectures Found --</option>';
            }
        } catch (err) {
            console.error("Lectures fetch error:", err);
            lectureSelect.innerHTML = '<option value="">-- Error Loading Lectures --</option>';
        }
    }

    async function playSelectedVideo() {
        const batchId = document.getElementById('batchSelect').value;
        const videoId = document.getElementById('lectureSelect').value;
        const video = document.getElementById('videoPlayer');
        const pdfBtn = document.getElementById('pdfLink');

        if (!videoId) return;

        try {
            const res = await fetch('/api/video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ course_id: batchId, video_id: videoId })
            });
            const data = await res.json();

            if (data.success && data.video_url) {
                let rawUrl = data.video_url;

                // Split token suffix if present
                if (rawUrl.includes('*')) {
                    rawUrl = rawUrl.split('*')[0];
                }

                if (data.pdf_url) {
                    pdfBtn.href = data.pdf_url;
                    pdfBtn.style.display = 'inline-block';
                } else {
                    pdfBtn.style.display = 'none';
                }

                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                // Signed Proxy Request Route
                const proxiedUrl = `/api/proxy?url=${encodeURIComponent(rawUrl)}`;

                if (rawUrl.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true
                        });
                        hlsInstance.loadSource(proxiedUrl);
                        hlsInstance.attachMedia(video);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(e => console.log("Autoplay blocked:", e)));

                        // Auto-recovery for playback errors
                        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.log("Network error encounter, trying to recover...");
                                        hlsInstance.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.log("Media error encounter, trying to recover...");
                                        hlsInstance.recoverMediaError();
                                        break;
                                    default:
                                        hlsInstance.destroy();
                                        break;
                                }
                            }
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = proxiedUrl;
                        video.play();
                    }
                } else {
                    video.src = proxiedUrl;
                    video.play();
                }
            } else {
                alert("Stream URL fetch nahi ho saki.");
            }
        } catch (err) {
            console.error("Play Video Error:", err);
        }
    }
</script>
</body>
    </html>
