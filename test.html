<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>『 𝐌𝐑𝐒𝐓𝐑𝐀𝐍𝐆𝐄𝐑™ 』 Batch Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { margin-bottom: 20px; color: #58a6ff; font-size: 1.8rem; }
        .controls { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        select { padding: 12px; background: #161b22; color: #f0f6fc; border: 1px solid #30363d; border-radius: 6px; font-size: 1rem; outline: none; }
        select:focus { border-color: #58a6ff; }
        video { width: 100%; max-width: 850px; background: #000; border-radius: 8px; border: 1px solid #30363d; aspect-ratio: 16/9; }
    </style>
</head>
<body>

    <h1>Batch Video Player</h1>

    <div class="controls">
        <select id="batchSelect" onchange="loadSubjects()">
            <option value="">-- Select Batch --</option>
        </select>

        <select id="subjectSelect" onchange="loadTopics()">
            <option value="">-- Select Subject --</option>
        </select>

        <select id="topicSelect" onchange="playSelectedVideo()">
            <option value="">-- Select Lecture / Topic --</option>
        </select>
    </div>

    <video id="videoPlayer" controls></video>

<script>
    let hlsInstance = null;

    window.onload = async () => {
        try {
            const res = await fetch('/api/batches', { method: 'POST', headers: {'Content-Type': 'application/json'} });
            const data = await res.json();
            const batchSelect = document.getElementById('batchSelect');
            
            if (Array.isArray(data)) {
                data.forEach(batch => {
                    let opt = document.createElement('option');
                    opt.value = batch.id || batch.batch_id;
                    opt.textContent = batch.name || batch.batch_name;
                    batchSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Batches fetch error:", err);
        }
    };

    async function loadSubjects() {
        const batchId = document.getElementById('batchSelect').value;
        const subjectSelect = document.getElementById('subjectSelect');
        subjectSelect.innerHTML = '<option value="">-- Select Subject --</option>';

        if (!batchId) return;

        try {
            const res = await fetch('/api/subjects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ batch_id: batchId })
            });
            const data = await res.json();

            if (Array.isArray(data)) {
                data.forEach(sub => {
                    let opt = document.createElement('option');
                    opt.value = sub.id || sub.subject_id;
                    opt.textContent = sub.name || sub.subject_name;
                    subjectSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Subjects fetch error:", err);
        }
    }

    async function loadTopics() {
        const subjectId = document.getElementById('subjectSelect').value;
        const topicSelect = document.getElementById('topicSelect');
        topicSelect.innerHTML = '<option value="">-- Select Lecture / Topic --</option>';

        if (!subjectId) return;

        try {
            const res = await fetch('/api/topics', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ subject_id: subjectId })
            });
            const data = await res.json();

            if (Array.isArray(data)) {
                data.forEach(topic => {
                    let opt = document.createElement('option');
                    opt.value = topic.video_url || topic.link || topic.url;
                    opt.textContent = topic.name || topic.title;
                    topicSelect.appendChild(opt);
                });
            }
        } catch (err) {
            console.error("Topics fetch error:", err);
        }
    }

    function playSelectedVideo() {
        const videoUrl = document.getElementById('topicSelect').value;
        const video = document.getElementById('videoPlayer');

        if (!videoUrl) return;

        if (hlsInstance) {
            hlsInstance.destroy();
        }

        if (videoUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(videoUrl);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoUrl;
                video.play();
            }
        } else {
            video.src = videoUrl;
            video.play();
        }
    }
</script>
</body>
</html>
